name: Build ERaZor Night Hill Place for RSDKv4

on:
  push:
    branches:
      - actions/erazor-source-artifact
    paths:
      - .github/workflows/port-erazor-ghz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-ghz:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout conversion workspace
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone pinned source repositories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/Selbi182/ERaZor.git ERaZor
          git -C ERaZor fetch --depth 1 origin 329d1246d3b6ec89fb081b64cd46928f9e297ace
          git -C ERaZor checkout --detach 329d1246d3b6ec89fb081b64cd46928f9e297ace
          # ERaZor's GHZ map file contains 128x128 chunks; make SonLVL read its actual chunk size.
          $iniPath = 'ERaZor/src/SonLVL INIs/SonLVL.ini'
          $iniText = [IO.File]::ReadAllText($iniPath)
          $chunkLine = 'chunks=../LevelData/map256/ghz.kosp'
          $chunkLineWithSize = $chunkLine + [Environment]::NewLine + 'chunkwidth=128' + [Environment]::NewLine + 'chunkheight=128'
          $iniText = $iniText.Replace($chunkLine, $chunkLineWithSize)
          [IO.File]::WriteAllText($iniPath, $iniText, (New-Object System.Text.UTF8Encoding($false)))
          $artDir = 'ERaZor/src/artkosp'
          Copy-Item -LiteralPath "$artDir/8x8ghz.kospm" -Destination "$artDir/8x8ghz1.kospm" -Force
          Get-ChildItem -LiteralPath 'ERaZor/src/SonLVL INIs/GHZ' -Filter '*.cs' -File | ForEach-Object {
            $source = Get-Content -LiteralPath $_.FullName -Raw
            $source = $source.Replace('CompressionType.Nemesis','CompressionType.KosinskiPlusM')
            Set-Content -LiteralPath $_.FullName -Value $source -Encoding UTF8
          }
          git clone --depth 1 https://github.com/ElspethThePict/S2Absolute.git S2Absolute
          git -C S2Absolute fetch --depth 1 origin a4de68f96eb184258fc87c1cacef9692f425ecec
          git -C S2Absolute checkout --detach a4de68f96eb184258fc87c1cacef9692f425ecec
          git clone --depth 1 https://github.com/MainMemory/RetroConverter.git RetroConverter

      - name: Add headless RetroConverter entry point
        shell: pwsh
        run: |
          # Adapt the S1 object model to the nearest S2A global object when the
          # behavior is sufficiently close, then convert S1 ring groups/springs/spikes.
          $formPath = 'RetroConverter/RetroConverter/Form1.cs'
          $formSource = Get-Content -LiteralPath $formPath -Raw
          $aliasReplacement = @'
          {
              name = def.Name;
              switch (name)
              {
                  case "Signpost": name = "Sign Post"; break;
                  case "Lamppost": name = "Star Post"; break;
                  case "Spring": name = "Red Spring"; break;
                  case "Egg Prison": name = "Animal Prison"; break;
                  case "Hidden Point Bonus": name = "Object Score"; break;
                  case "Invisible solid block": name = "Invisible Block"; break;
                  case "Bridge Stump": name = "Bridge End"; break;
                  case "Buzz Bomber": name = "Buzzer"; break;
                  case "Chopper": name = "Chop Chop"; break;
              }
          }
          '@
          if (!$formSource.Contains('name = def.Name;')) { throw 'Could not find source object-name mapping in RetroConverter.' }
          $formSource = $formSource.Replace('name = def.Name;', $aliasReplacement)

          # Reserve the exact local object IDs expected by reusable S2A GHZ object scripts.
          $stageSeed = @'
          List<KeyValuePair<string, string>> seededStageObjects = new List<KeyValuePair<string, string>>();
                      Action<string, string> addSeededStageObject = (name, script) =>
                      {
                          objNames.Add(name);
                          seededStageObjects.Add(new KeyValuePair<string, string>(name, script));
                      };
                      addSeededStageObject("Fall Platform", "EHZ/FPlatform.txt"); // ID 41
                      addSeededStageObject("H Platform", "EHZ/HPlatform.txt");     // ID 42
                      addSeededStageObject("V Platform", "EHZ/VPlatform.txt");     // ID 43
                      for (int id = 44; id <= 44; id++)
                      {
                          string name = "ERaZor Reserved " + id;
                          addSeededStageObject(name, LevelData.Level.DisplayName + "\\" + name + ".txt");
                      }
                      addSeededStageObject("Bridge", "EHZ/Bridge.txt");             // ID 45
                      addSeededStageObject("Bridge End", "EHZ/BridgeEnd.txt");      // ID 46
                      for (int id = 47; id <= 53; id++)
                      {
                          string name = "ERaZor Reserved " + id;
                          addSeededStageObject(name, LevelData.Level.DisplayName + "\\" + name + ".txt");
                      }
                      addSeededStageObject("Buzzer", "Enemies/Buzzer.txt");          // ID 54
                      addSeededStageObject("Buzzer Shot", "Enemies/BuzzerShot.txt");// ID 55
                      for (int id = 56; id <= 66; id++)
                      {
                          string name = "ERaZor Reserved " + id;
                          addSeededStageObject(name, LevelData.Level.DisplayName + "\\" + name + ".txt");
                      }
                      addSeededStageObject("Chop Chop", "Enemies/ChopChop.txt");     // ID 67
          '@
          $formSource = $formSource.Replace('Stageconfig4 cfg = new Stageconfig4() { loadGlobalObjects = true };', 'Stageconfig4 cfg = new Stageconfig4() { loadGlobalObjects = true };' + [Environment]::NewLine + $stageSeed)
          $oldEntity = 'scene.entities.Add(new Object4(objMap[obj.ID], obj.SubType, obj.X << 16, obj.Y << 16));'
          $newEntity = @'
                          if (obj.ID == 0x25)
                          {
                              // S1 Ring objects encode count and a 16-way spacing pattern in SubType.
                              System.Drawing.Point[] ringSpacing = new System.Drawing.Point[] {
                                  new System.Drawing.Point(0x10, 0), new System.Drawing.Point(0x18, 0),
                                  new System.Drawing.Point(0x20, 0), new System.Drawing.Point(0, 0x10),
                                  new System.Drawing.Point(0, 0x18), new System.Drawing.Point(0, 0x20),
                                  new System.Drawing.Point(0x10, 0x10), new System.Drawing.Point(0x18, 0x18),
                                  new System.Drawing.Point(0x20, 0x20), new System.Drawing.Point(-0x10, 0x10),
                                  new System.Drawing.Point(-0x18, 0x18), new System.Drawing.Point(-0x20, 0x20),
                                  new System.Drawing.Point(0x10, 8), new System.Drawing.Point(0x18, 0x10),
                                  new System.Drawing.Point(-0x10, 8), new System.Drawing.Point(-0x18, 0x10)
                              };
                              int ringCount = Math.Min(6, obj.SubType & 7) + 1;
                              int ringDirection = obj.SubType >> 4;
                              for (int ring = 0; ring < ringCount; ring++)
                              {
                                  int ringX = obj.X + ringSpacing[ringDirection].X * ring;
                                  int ringY = obj.Y + ringSpacing[ringDirection].Y * ring;
                                  scene.entities.Add(new Object4((byte)ringid, 0, ringX << 16, ringY << 16));
                              }
                          }
                          else
                          {
                              byte entityType = objMap[obj.ID];
                              byte entitySubtype = obj.SubType;
                              if (obj.ID == 0x41)
                              {
                                  // S1 spring: bit 1 selects yellow; bits 4/5 select horizontal/down.
                                  bool yellow = (obj.SubType & 0x02) != 0;
                                  entityType = (byte)(objNames.IndexOf(yellow ? "Yellow Spring" : "Red Spring") + 1);
                                  if ((obj.SubType & 0x20) != 0)
                                      entitySubtype = 3; // down
                                  else if ((obj.SubType & 0x10) != 0)
                                      entitySubtype = (byte)(obj.XFlip ? 2 : 1); // left/right
                                  else
                                      entitySubtype = 0; // up
                              }
                              else if (obj.ID == 0x36)
                              {
                                  // S1 spike subtype encodes shape/movement; S2A uses four direction values.
                                  int spikeType = (obj.SubType >> 4) & 7;
                                  entitySubtype = (byte)((spikeType == 1 || spikeType == 5)
                                      ? (obj.XFlip ? 2 : 1)
                                      : (obj.YFlip ? 3 : 0));
                              }
                              scene.entities.Add(new Object4(entityType, entitySubtype, obj.X << 16, obj.Y << 16));
                          }
          '@
          if (!$formSource.Contains($oldEntity)) { throw 'Could not find RSDKv4 object-entity conversion statement.' }
          $platformHandling = @'
                              if (obj.ID == 0x18)
                              {
                                  // S1 GHZ platform movement subtypes to the matching S2A stage-local object IDs.
                                  int movement = obj.SubType & 0x0F;
                                  if (movement == 3) { entityType = 41; entitySubtype = 0; }      // falls when stood on
                                  else if (movement == 1) { entityType = 42; entitySubtype = 0; } // right to left
                                  else if (movement == 5) { entityType = 42; entitySubtype = 1; } // left to right
                                  else if (movement == 2) { entityType = 43; entitySubtype = 0; } // down to up
                                  else if (movement == 6) { entityType = 43; entitySubtype = 1; } // up to down
                              }
                              else if (obj.ID == 0x22)
                              {
                                  // S1 Buzz Bomber uses the S2A Buzzer script; X flip selects flight direction.
                                  entityType = 54;
                                  entitySubtype = (byte)(obj.XFlip ? 1 : 0);
                              }
                              else if (obj.ID == 0x2B)
                              {
                                  // S1 Chopper is represented by the closest built-in jumping fish enemy.
                                  entityType = 67;
                                  entitySubtype = (byte)(obj.XFlip ? 1 : 0);
                              }
          '@
          if (!$formSource.Contains($oldEntity)) { throw 'Could not find RSDKv4 object-entity conversion statement.' }
          $formSource = $formSource.Replace($oldEntity, $newEntity.Replace('                              scene.entities.Add(new Object4(entityType, entitySubtype, obj.X << 16, obj.Y << 16));', $platformHandling + [Environment]::NewLine + '                              scene.entities.Add(new Object4(entityType, entitySubtype, obj.X << 16, obj.Y << 16));')))

          $formSource = $formSource.Replace(
              'foreach (string name in newobjs)' + [Environment]::NewLine + "`t`t`tforeach (string name in newobjs)",
              'foreach (KeyValuePair<string, string> item in seededStageObjects)' + [Environment]::NewLine +
              "`t`t`t`tcfg.objects.Add(new Gameconfig4.ObjectInfo() { name = item.Key, script = item.Value });" +
              [Environment]::NewLine + "`t`t`tforeach (string name in newobjs)")
          Set-Content -LiteralPath $formPath -Value $formSource -Encoding UTF8
          Set-Content -LiteralPath $formPath -Value $formSource -Encoding UTF8

          $program = @'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Windows.Forms;
          using SonicRetro.SonLVL.API;

          namespace RetroConverter
          {
              static class Program
              {
                  private static string MapSourceObjectName(string sourceName)
                  {
                      switch (sourceName)
                      {
                          case "Signpost": return "Sign Post";
                          case "Lamppost": return "Star Post";
                          case "Spring": return "Red Spring";
                          case "Egg Prison": return "Animal Prison";
                          case "Hidden Point Bonus": return "Object Score";
                          case "Invisible solid block": return "Invisible Block";
                          case "Bridge Stump": return "Bridge End";
                          case "Buzz Bomber": return "Buzzer";
                          case "Chopper": return "Chop Chop";
                          default: return sourceName;
                      }
                  }

                  [STAThread]
                  static int Main(string[] args)
                  {
                      if (args.Length == 0 || args[0] != "--convert")
                      {
                          Application.EnableVisualStyles();
                          Application.SetCompatibleTextRenderingDefault(false);
                          Application.Run(new Form1());
                          return 0;
                      }

                      try
                      {
                          if (args.Length < 6)
                              throw new ArgumentException("Usage: RetroConverter.exe --convert <SonLVL.ini> <level name> <GameConfig.bin> <output dir> <include objects true|false>");

                          Application.EnableVisualStyles();
                          Application.SetCompatibleTextRenderingDefault(false);
                          LevelData.LogEvent += message => Console.WriteLine(String.Join(" ", message));

                          Form1 form = new Form1();
                          Type formType = typeof(Form1);
                          BindingFlags flags = BindingFlags.Instance | BindingFlags.NonPublic;

                          formType.GetMethod("LoadProject", flags).Invoke(form, new object[] { args[1] });
                          List<string> levels = (List<string>)formType.GetField("Levels", flags).GetValue(form);
                          string selectedLevel = levels.FirstOrDefault(level =>
                              String.Equals(level, args[2], StringComparison.OrdinalIgnoreCase) ||
                              String.Equals(LevelData.Game.GetLevelInfo(level).DisplayName, args[2], StringComparison.OrdinalIgnoreCase));
                          if (selectedLevel == null)
                              throw new InvalidOperationException("Level not found. Available: " + String.Join(" | ", levels));

                          formType.GetMethod("LoadGameConfig", flags).Invoke(form, new object[] { args[3] });
                          ((FolderBrowserDialog)formType.GetField("rsdkExportDialog", flags).GetValue(form)).SelectedPath = args[4];
                          bool includeObjects = Boolean.Parse(args[5]);
                          ((CheckBox)formType.GetField("includeObjectsCheckBox", flags).GetValue(form)).Checked = includeObjects;

                          Directory.CreateDirectory(args[4]);
                          LevelData.LoadLevel(selectedLevel, true);

                          File.WriteAllLines(Path.Combine(args[4], "ERaZor-object-definitions.csv"),
                              new[] { "SourceID,Name" }.Concat(LevelData.ObjTypes.OrderBy(kv => kv.Key)
                                  .Select(kv => String.Format("0x{0:X2},\"{1}\"", kv.Key, (kv.Value.Name ?? "").Replace("\"", "\"\"")))));

                          RSDKv4.GameConfig targetConfig = new RSDKv4.GameConfig(args[3]);
                          File.WriteAllLines(Path.Combine(args[4], "S2A-global-object-types.csv"),
                              new[] { "TargetID,Name" }.Concat(targetConfig.objects.Select((obj, index) =>
                                  String.Format("{0},\"{1}\"", index + 1, (obj.name ?? "").Replace("\"", "\"\"")))));

                          var seededTypeNames = new HashSet<string>(new[] {
                              "Fall Platform", "H Platform", "V Platform", "Bridge", "Bridge End",
                              "Buzzer", "Buzzer Shot", "Chop Chop"
                          }, StringComparer.Ordinal);
                          var reservedTypeNames = new List<string>();
                          reservedTypeNames.Add("ERaZor Reserved 44");
                          for (int id = 47; id <= 53; id++) reservedTypeNames.Add("ERaZor Reserved " + id);
                          for (int id = 56; id <= 66; id++) reservedTypeNames.Add("ERaZor Reserved " + id);
                          File.WriteAllLines(Path.Combine(args[4], "ERaZor-reserved-object-types.txt"), reservedTypeNames);
                          foreach (string reserved in reservedTypeNames) seededTypeNames.Add(reserved);

                          var customTypes = LevelData.Objects
                              .Select(obj => {
                                  string sourceName;
                                  if (LevelData.ObjTypes.TryGetValue(obj.ID, out ObjectDefinition def))
                                      sourceName = def.Name;
                                  else
                                      sourceName = String.Format("Unk{0:X2}", obj.ID);
                                  return MapSourceObjectName(sourceName);
                              })
                              .Distinct()
                              .Where(name => !targetConfig.objects.Any(target => target.name == name) && !seededTypeNames.Contains(name))
                              .OrderBy(name => name)
                              .ToArray();
                          File.WriteAllLines(Path.Combine(args[4], "ERaZor-custom-object-types.txt"), customTypes);

                          var objectReport = new List<string> { "SourceID,SourceName,Placements,TargetObject,Handling" };
                          foreach (var group in LevelData.Objects.GroupBy(obj => obj.ID).OrderBy(group => group.Key))
                          {
                              string sourceName;
                              if (LevelData.ObjTypes.TryGetValue(group.Key, out ObjectDefinition def))
                                  sourceName = def.Name;
                              else
                                  sourceName = String.Format("Unk{0:X2}", group.Key);
                              string targetName = MapSourceObjectName(sourceName);
                              string handling = customTypes.Contains(targetName)
                                  ? "Stage-local no-op placeholder until object behavior is ported"
                                  : (seededTypeNames.Contains(targetName)
                                      ? "Mapped to existing S2A stage-local script"
                                      : "Mapped to S2A global object");
                              if (group.Key == 0x25) handling = "S1 count/spacing pattern expanded into individual Ring entities";
                              if (group.Key == 0x41) handling = "S1 color and direction bits mapped to Red/Yellow Spring properties";
                              if (group.Key == 0x36) handling = "Approximate S1 spike orientation mapping; size variants are not preserved";
                              objectReport.Add(String.Format("0x{0:X2},\"{1}\",{2},\"{3}\",\"{4}\"",
                                  group.Key, sourceName.Replace("\"", "\"\""), group.Count(), targetName, handling));
                          }
                          File.WriteAllLines(Path.Combine(args[4], "ObjectConversionReport.csv"), objectReport);
                          int expandedRingCount = LevelData.Objects
                              .Where(obj => obj.ID == 0x25)
                              .Sum(obj => Math.Min(6, obj.SubType & 7) + 1);
                          Console.WriteLine("S1 ring groups expanded to " + expandedRingCount + " individual rings.");
                          Console.WriteLine("Stage-local placeholder object types: " + customTypes.Length);

                          Console.WriteLine("Source level: " + selectedLevel);
                          Console.WriteLine("Source objects: " + LevelData.Objects.Count);
                          Console.WriteLine("Source rings: " + LevelData.Rings.Count);
                          Console.WriteLine("Source chunks: " + LevelData.Chunks.Count);
                          Console.WriteLine("Source blocks: " + LevelData.Blocks.Count);
                          Console.WriteLine("Source object definitions: " + LevelData.ObjTypes.Count);
                          Console.WriteLine("Target global object definitions: " + targetConfig.objects.Count);

                          // Repair only invalid source layout references; map them to SonLVL's synthetic blank chunk (index 0).
                          int invalidFG = 0, invalidBG = 0, nullChunkBlocks = 0;
                          ushort[,] fg = LevelData.Layout.FGLayout;
                          for (int y = 0; y < fg.GetLength(1); y++)
                              for (int x = 0; x < fg.GetLength(0); x++)
                              {
                                  ushort id = fg[x, y];
                                  if (id >= LevelData.Chunks.Count || LevelData.Chunks[id] == null)
                                  {
                                      Console.WriteLine("FG layout [" + x + "," + y + "] references missing chunk " + id + "; using blank chunk 0.");
                                      fg[x, y] = 0;
                                      invalidFG++;
                                  }
                              }
                          ushort[,] bgLayout = LevelData.Layout.BGLayout;
                          for (int y = 0; y < bgLayout.GetLength(1); y++)
                              for (int x = 0; x < bgLayout.GetLength(0); x++)
                              {
                                  ushort id = bgLayout[x, y];
                                  if (id >= LevelData.Chunks.Count || LevelData.Chunks[id] == null)
                                  {
                                      Console.WriteLine("BG layout [" + x + "," + y + "] references missing chunk " + id + "; using blank chunk 0.");
                                      bgLayout[x, y] = 0;
                                      invalidBG++;
                                  }
                              }
                          for (int ci = 0; ci < LevelData.Chunks.Count; ci++)
                          {
                              var chunk = LevelData.Chunks[ci];
                              if (chunk == null) continue;
                              for (int by = 0; by < chunk.Blocks.GetLength(1); by++)
                                  for (int bx = 0; bx < chunk.Blocks.GetLength(0); bx++)
                                      if (chunk.Blocks[bx, by] == null)
                                      {
                                          chunk.Blocks[bx, by] = ChunkBlock.Create(EngineVersion.S1);
                                          chunk.Blocks[bx, by].Block = 0;
                                          nullChunkBlocks++;
                                      }
                          }
                          Console.WriteLine("Missing layout refs repaired: FG=" + invalidFG + ", BG=" + invalidBG + ", null chunk cells filled=" + nullChunkBlocks);

                          FolderBrowserDialog exportDialog = (FolderBrowserDialog)formType.GetField("rsdkExportDialog", flags).GetValue(form);
                          exportDialog.SelectedPath = Path.GetFullPath(args[4]);
                          Console.WriteLine("RSDKv4 export directory before conversion: " + exportDialog.SelectedPath);
                          Console.WriteLine("Output directory exists before conversion: " + Directory.Exists(exportDialog.SelectedPath));
                          formType.GetMethod("ConvertV4", flags).Invoke(form, null);
                          Console.WriteLine("RSDKv4 export directory after conversion: " + exportDialog.SelectedPath);
                          foreach (string file in Directory.GetFiles(exportDialog.SelectedPath, "*", SearchOption.AllDirectories))
                              Console.WriteLine("EXPORTED FILE: " + file + " (" + new System.IO.FileInfo(file).Length + " bytes)");
                          string[] allStageConfigs = Directory.GetFiles(Environment.CurrentDirectory, "StageConfig.bin", SearchOption.AllDirectories);
                          foreach (string file in allStageConfigs)
                              Console.WriteLine("FOUND STAGECONFIG: " + file);
                          form.Dispose();
                          Console.WriteLine("RSDKv4 conversion finished.");
                          return 0;
                      }
                      catch (Exception ex)
                      {
                          Console.Error.WriteLine(ex);
                          return 1;
                      }
                  }
              }
          }
          '@
          Set-Content -LiteralPath 'RetroConverter/RetroConverter/Program.cs' -Value $program -Encoding UTF8

      - name: Build RetroConverter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'RetroConverter/RetroConverter.sln' /t:Build /p:Configuration=Release /p:Platform="Any CPU" /m
          $bin = 'RetroConverter/RetroConverter/bin/Release'
          Get-ChildItem 'RetroConverter' -Filter '*.dll' -File | Copy-Item -Destination $bin -Force
          Get-ChildItem $bin -Filter '*.dll' | Select-Object Name,Length | Format-Table -AutoSize

      - name: Convert Night Hill Place using S2A globals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ini = (Resolve-Path 'ERaZor/src/SonLVL INIs/SonLVL.ini').Path
          $game = (Resolve-Path 'S2Absolute/Mods/Sonic 2 Absolute/Data/Game/GameConfig.bin').Path
          $out = Join-Path $env:GITHUB_WORKSPACE 'ERaZor-NightHill-RSDKv4'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $exe = (Resolve-Path 'RetroConverter/RetroConverter/bin/Release/RetroConverter.exe').Path
          # Start-Process -Wait is required because RetroConverter is built as a WinExe.
          $argumentLine = '--convert "{0}" "{1}" "{2}" "{3}" true' -f $ini, 'Night Hill Place', $game, $out
          $process = Start-Process -FilePath $exe -ArgumentList $argumentLine -Wait -PassThru
          Write-Host "RetroConverter process exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "RetroConverter failed with exit code $($process.ExitCode)" }
          $required = @('StageConfig.bin','16x16Tiles.gif','128x128Tiles.bin','CollisionMasks.bin','Backgrounds.bin','Act1.bin')
          foreach ($name in $required) {
            $file = Join-Path $out $name
            if (!(Test-Path $file)) { throw "Missing converter output: $name" }
          }
          Get-ChildItem $out -File | Select-Object Name,Length | Format-Table -AutoSize

      - name: Package conversion artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'ERaZor-NightHill-RSDKv4'
          $readme = @'
          ERaZor 8.1 — Night Hill Place (GHZ) conversion experiment
          Source: https://github.com/Selbi182/ERaZor
          Source commit: 329d1246d3b6ec89fb081b64cd46928f9e297ace
          Converter: https://github.com/MainMemory/RetroConverter
          Target reference: https://github.com/ElspethThePict/S2Absolute
          Target source commit: a4de68f96eb184258fc87c1cacef9692f425ecec

          This package contains generated RSDKv4 stage files and object-ID reports.
          It is an experimental stage conversion, not a finished playable port.
          Original ERaZor music is intentionally excluded, as required by its README.
          ERaZor source credit: Selbi182. Source is CC BY-NC 4.0; see the upstream
          repository for license details. Do not use this package commercially.
          '@
          Set-Content -LiteralPath "$out/README-PORT.txt" -Value $readme -Encoding UTF8
          Compress-Archive -Path "$out/*" -DestinationPath 'ERaZor-NightHill-RSDKv4.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'ERaZor-NightHill-RSDKv4.zip' -Algorithm SHA256 | Format-List

      - name: Upload converted Night Hill stage
        uses: actions/upload-artifact@v4
        with:
          name: ERaZor-NightHill-RSDKv4
          path: ERaZor-NightHill-RSDKv4.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
